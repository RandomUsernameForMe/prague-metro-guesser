<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Guesser — kde vede pražské metro?</title>
  <meta name="description" content="Poznáš z leteckého snímku, kudy pod ním vede nástupiště pražského metra? Týdenní výzva, duel 1v1 a casual režim bez odpočtu.">
  <link rel="icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1113">

  <!-- dlaždice se tahají z ČÚZK hned na začátku kola; handshake ať je hotový dřív -->
  <link rel="preconnect" href="https://ags.cuzk.gov.cz">
  <link rel="stylesheet" href="style.css">
  <!-- fonty a data, na kterých stojí první vykreslení -->
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/anton-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="app.mjs">
  <link rel="preload" href="stations.json" as="fetch" crossorigin>

  <!-- pozvánka na duel se posílá odkazem, ať má v Messengeru náhled. Náhled je
       JPEG schválně: WebP ve Slacku ani na LinkedInu neprojde. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Metro Guesser">
  <meta property="og:locale" content="cs_CZ">
  <meta property="og:url" content="https://kdejemetro.guth.workers.dev/">
  <meta property="og:title" content="Metro Guesser — kde vede pražské metro?">
  <meta property="og:description" content="Dostaneš letecký snímek 600 × 600 m a jméno stanice. Nakresli, kudy pod ním vede nástupiště. Zahraj si duel 1v1.">
  <meta property="og:image" content="https://kdejemetro.guth.workers.dev/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Mřížka čtyř leteckých snímků pražských stanic metra s otázkou, kudy pod nimi vede nástupiště.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://kdejemetro.guth.workers.dev/og.jpg">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="app">
    <main id="stage">
      <div id="tiles"></div>
      <svg id="draw"></svg>
      <div id="timebar" hidden><span></span></div>
      <div id="transfer" hidden></div>
      <p id="hint" hidden></p>
      <button id="peek-back" class="btn btn-primary" hidden>zpět na výsledek</button>
      <div id="overlay" hidden></div>
    </main>

    <aside id="panel">
      <div class="brand">
        <span class="brand-mark">M</span>
        <span class="brand-name">Metro<br>Guesser</span>
      </div>

      <div class="task">
        <span id="line-badges" class="badges"></span>
        <h1 id="station-name">—</h1>
        <p id="round-label" class="label"></p>
      </div>

      <ol id="progress" class="progress"></ol>

      <div id="duel" hidden>
        <div class="duel-side">
          <span class="label">ty</span>
          <strong id="duel-me">0</strong>
        </div>
        <div class="duel-side">
          <span class="label" id="duel-name">soupeř</span>
          <strong id="duel-them">0</strong>
          <span id="duel-flag" class="duel-flag"></span>
        </div>
      </div>

      <div class="stats">
        <div class="score">
          <span class="label">skóre</span>
          <strong id="score-value">0</strong>
        </div>
        <div class="clock" id="clock" hidden>
          <span class="label">čas</span>
          <strong id="clock-value">15</strong>
        </div>
      </div>

      <p id="duel-shot" hidden></p>
      <p id="duel-legend" class="duel-legend" hidden></p>

      <div id="controls">
        <button id="clear" class="btn btn-outline">Smazat</button>
        <button id="confirm" class="btn btn-primary" disabled>Potvrdit</button>
      </div>

      <button id="home" class="link-btn" hidden>← zpět na začátek</button>
    </aside>

    <footer id="attribution">ortofoto © ČÚZK · data © OpenStreetMap · <a id="photo-credit" target="_blank" rel="noopener"></a></footer>
  </div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
