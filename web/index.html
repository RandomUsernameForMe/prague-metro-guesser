<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metro Guesser — kde vede pražské metro?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Anton&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <div id="app">
    <main id="stage">
      <div id="tiles"></div>
      <svg id="draw"></svg>
      <div id="timebar" hidden><span></span></div>
      <p id="hint" hidden></p>
      <div id="overlay" hidden></div>
      <footer id="attribution">ortofoto © ČÚZK · data © OpenStreetMap · <a id="photo-credit" target="_blank" rel="noopener"></a></footer>
    </main>

    <aside id="panel">
      <div class="brand">
        <span class="brand-mark">M</span>
        <span class="brand-name">Metro<br>Guesser</span>
      </div>

      <div class="task">
        <span id="line-badges" class="badges"></span>
        <h1 id="station-name">—</h1>
        <p id="round-label" class="label"></p>
      </div>

      <ol id="progress" class="progress"></ol>

      <div id="duel" hidden>
        <div class="duel-side">
          <span class="label">ty</span>
          <strong id="duel-me">0</strong>
        </div>
        <div class="duel-side">
          <span class="label" id="duel-name">soupeř</span>
          <strong id="duel-them">0</strong>
          <span id="duel-flag" class="duel-flag"></span>
        </div>
      </div>

      <div class="stats">
        <div class="score">
          <span class="label">skóre</span>
          <strong id="score-value">0</strong>
        </div>
        <div class="clock" id="clock" hidden>
          <span class="label">čas</span>
          <strong id="clock-value">15</strong>
        </div>
      </div>

      <p id="duel-shot" hidden></p>
      <p id="duel-legend" class="duel-legend" hidden></p>

      <div id="controls">
        <button id="clear" class="btn btn-outline">Smazat</button>
        <button id="confirm" class="btn btn-primary" disabled>Potvrdit</button>
      </div>

      <button id="home" class="link-btn" hidden>← zpět na začátek</button>
    </aside>
  </div>
  <script type="module" src="app.mjs"></script>
</body>
</html>
