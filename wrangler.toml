name = "prague-metro-guesser"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./web"

[[d1_databases]]
binding = "DB"
database_name = "metro-guesser"
database_id = "853881c9-743d-4803-88cb-71cf7cf98b72"
# migrace schématu: `npm run migrate` (viz DEPLOY.md). Pozor, není to totéž co
# [[migrations]] níž — ty jsou o třídách Durable Objectů, ne o tabulkách.
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchDO"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "LobbyDO"

# SQLite backend je podmínka pro Durable Objects na free plánu
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchDO", "LobbyDO"]
